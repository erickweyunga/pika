[package]
name = "pika_cli"
description = "The `pika` command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pika"
path = "src/main.rs"

[dependencies]
clap.workspace = true
pika_diagnostics.workspace = true
pika_driver.workspace = true
pika_fmt.workspace = true
pika_syntax.workspace = true

[target.'cfg(target_env = "msvc")'.dependencies]
# Finds the Visual C++ linker, which links the executables of `pika build`.
cc.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
